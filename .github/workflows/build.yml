name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix spec
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          sed -i 's/requirements =.*/requirements = python3,kivy/' buildozer.spec
          echo "android.accept_sdk_license_agreements = True" >> buildozer.spec
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mari-apk
          path: bin/*.apk
