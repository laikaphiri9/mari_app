name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev libbz2-dev libsqlite3-dev
          pip install buildozer cython==0.29.33
      - name: Fix buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          sed -i 's/requirements =.*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/#*android.permissions.*/android.permissions = INTERNET/' buildozer.spec
          sed -i 's/#*android.accept_sdk_license_agreements.*/android.accept_sdk_license_agreements = True/' buildozer.spec
          echo "android.accept_sdk_license_agreements = True" >> buildozer.spec
          cat buildozer.spec
      - name: Build APK
        run: |
          yes | sdkmanager --licenses || true
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mari-apk
          path: bin/*.apk
