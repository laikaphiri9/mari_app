name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            openjdk-17-jdk \
            zip \
            unzip \
            wget

      - name: Cache Buildozer global directory (SDK, NDK)
        uses: actions/cache@v5
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache Buildozer project directory (.buildozer)
        uses: actions/cache@v5
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-local-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-local-

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0" buildozer

      - name: Set up Android SDK paths & licenses
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          mkdir -p "$SDK_DIR/licenses"

          # Download official command line tools if missing
          if [ ! -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            cp -r cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/" 2>/dev/null || true
            rm -rf cmdline-tools cmdline-tools.zip
          fi

          # Symlink legacy tools path so Buildozer finds sdkmanager
          mkdir -p "$SDK_DIR/tools"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin" "$SDK_DIR/tools/bin"

          # Pre-accept licenses
          printf "89337d025d6403739607760c365899ac21847d24\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63718c303a4928bf5426001ef82a4fa1" > "$SDK_DIR/licenses/android-sdk-license"
          printf "8454b87ee1700025320092110d29d4993a404b90" > "$SDK_DIR/licenses/android-sdk-preview-license"

      - name: Build APK with Buildozer
        run: |
          buildozer -s android debug --accept-sdk-license

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: bin/*.apk
